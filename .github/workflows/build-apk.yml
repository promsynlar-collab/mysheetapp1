name: Build Android APK (100% Free & Automated)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Fix: Find Files & Unzip If Needed
        run: |
          # Αν ανέβηκε αρχείο zip, το αποσυμπιέζει μόνο του
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Βρέθηκε zip αρχείο, αποσυμπίεση..."
            unzip -o "$ZIP_FILE"
          fi

          # Ψάχνει το package.json σε οποιονδήποτε υποφάκελο κι αν μπήκε
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            TARGET_DIR=$(dirname "$PKG_PATH")
            echo "Βρέθηκε το έργο στον φάκελο: $TARGET_DIR"
            if [ "$TARGET_DIR" != "." ]; then
              shopt -s dotglob
              cp -r "$TARGET_DIR"/* . || true
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
